<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">ClockWork: one obligation engine, human decisions</title><desc id="desc">An institution supplies evidence. Officers review it, committees inspect when the configured route requires it, and the competent authority makes the decision. The obligation engine monitors each stage and explains deadlines, pauses and escalations.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#16704f"/></marker></defs>
<rect width="1200" height="460" rx="20" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#142d4e"><text x="40" y="55" font-size="27" font-weight="bold">ClockWork / One engine. Every deadline.</text><text x="40" y="85" font-size="16" fill="#526580">Configured routes and reminders support competent human authorities.</text>
<rect x="40" y="125" width="244" height="106" rx="14" fill="white" stroke="#cbd8e7"/><text x="58" y="164" font-size="20" font-weight="bold">Institution</text><text x="58" y="195" font-size="15" fill="#526580">Application / evidence</text><path d="M288 177h36" stroke="#16704f" stroke-width="2" marker-end="url(#arrow)"/><rect x="332" y="125" width="244" height="106" rx="14" fill="white" stroke="#cbd8e7"/><text x="350" y="164" font-size="20" font-weight="bold">Officer review</text><text x="350" y="195" font-size="15" fill="#526580">Scrutiny / clarification</text><path d="M580 177h36" stroke="#16704f" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="125" width="244" height="106" rx="14" fill="white" stroke="#cbd8e7"/><text x="642" y="164" font-size="20" font-weight="bold">Committee</text><text x="642" y="195" font-size="15" fill="#526580">EVC / SAC when required</text><path d="M872 177h36" stroke="#16704f" stroke-width="2" marker-end="url(#arrow)"/><rect x="916" y="125" width="244" height="106" rx="14" fill="white" stroke="#cbd8e7"/><text x="934" y="164" font-size="20" font-weight="bold">Human decision</text><text x="934" y="195" font-size="15" fill="#526580">Approve / reject / verify</text><rect x="40" y="278" width="1120" height="99" rx="14" fill="#142d4e"/><text x="64" y="315" font-size="21" fill="white" font-weight="bold">Shared obligation engine</text><text x="64" y="347" font-size="17" fill="#d6e5f5">Due dates / configured pause-resume / reasoned alerts / escalation history / scoped reports</text><text x="40" y="420" font-size="15" fill="#526580">Illustrative product workflow. Routing and alerts never grant statutory approval. AI is not required.</text></g></svg>