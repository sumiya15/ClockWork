<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>ClockWork | Current prototype</title><desc>Working browser interactions with fictional records; no operational backend calls from this interface</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b50"/></marker></defs><rect width="1920" height="1080" fill="#f7f8f5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="88" font-size="50" font-weight="700" fill="#163f2d">ClockWork | Current prototype</text><text x="72" y="135" font-size="25" font-weight="400" fill="#56645c">Working browser interactions with fictional records; no operational backend calls from this interface</text><rect x="65" y="230" width="360" height="245" rx="18" fill="#e8f3ec" stroke="#5b8770" stroke-width="2" /><text x="89" y="272" font-size="26" font-weight="650" fill="#146347">React mobile interface</text><text x="89" y="316" font-size="23" font-weight="400" fill="#24332c">Today · dashboards · registers</text><text x="89" y="350" font-size="23" font-weight="400" fill="#24332c">Case actions · six CSV reports</text><text x="89" y="384" font-size="23" font-weight="400" fill="#24332c">Personas simulate role scope</text><text x="89" y="418" font-size="23" font-weight="400" fill="#24332c">Human: return, visit, verify</text><rect x="525" y="230" width="360" height="245" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" /><text x="549" y="272" font-size="26" font-weight="650" fill="#146347">Shared local state</text><text x="549" y="316" font-size="23" font-weight="400" fill="#24332c">DemoApp: data + current ref</text><text x="549" y="350" font-size="23" font-weight="400" fill="#24332c">act(operation) passes state</text><text x="549" y="384" font-size="23" font-weight="400" fill="#24332c">Case, evidence and rule records</text><text x="549" y="418" font-size="23" font-weight="400" fill="#24332c">Results trigger React rendering</text><rect x="985" y="230" width="400" height="245" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" /><text x="1009" y="272" font-size="26" font-weight="650" fill="#146347">Workflow &amp; deadlines</text><text x="1009" y="316" font-size="23" font-weight="400" fill="#24332c">service.js + model.js</text><text x="1009" y="350" font-size="23" font-weight="400" fill="#24332c">Routes · SLA pause/resume</text><text x="1009" y="384" font-size="23" font-weight="400" fill="#24332c">targets → evaluate → milestones</text><text x="1009" y="418" font-size="23" font-weight="400" fill="#24332c">Officer verification gates</text><rect x="1485" y="230" width="370" height="245" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" /><text x="1509" y="272" font-size="26" font-weight="650" fill="#146347">Local persistence</text><text x="1509" y="316" font-size="23" font-weight="400" fill="#24332c">saveDemo / loadDemo</text><text x="1509" y="350" font-size="23" font-weight="400" fill="#24332c">localStorage: full state</text><text x="1509" y="384" font-size="23" font-weight="400" fill="#24332c">sessionStorage: view choices</text><text x="1509" y="418" font-size="23" font-weight="400" fill="#24332c">File metadata only</text><polyline points="425,340 525,340" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="440" y="321" font-size="21" font-weight="400" fill="#56645c">Actions</text><polyline points="885,340 985,340" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="895" y="321" font-size="21" font-weight="400" fill="#56645c">Calculate</text><polyline points="1385,340 1485,340" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="1408" y="321" font-size="21" font-weight="400" fill="#56645c">Save</text><polyline points="1185,475 1185,550 705,550 705,475" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="765" y="533" font-size="21" font-weight="400" fill="#56645c">Return next state; update React</text><polyline points="1670,475 1670,600 705,600 705,475" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="1410" y="628" font-size="21" font-weight="400" fill="#56645c">Reload restores state</text><rect x="65" y="710" width="510" height="205" rx="18" fill="#e8f3ec" stroke="#5b8770" stroke-width="2" /><text x="89" y="752" font-size="26" font-weight="650" fill="#146347">AI Assist · simulated preview</text><text x="89" y="796" font-size="23" font-weight="400" fill="#24332c">assistant.js reads scoped case facts</text><text x="89" y="830" font-size="23" font-weight="400" fill="#24332c">Deterministic templates; no model</text><text x="89" y="864" font-size="23" font-weight="400" fill="#24332c">Drafts require human review</text><rect x="690" y="710" width="520" height="205" rx="18" fill="#e8f3ec" stroke="#5b8770" stroke-width="2" /><text x="714" y="752" font-size="26" font-weight="650" fill="#146347">Notifications · simulated</text><text x="714" y="796" font-size="23" font-weight="400" fill="#24332c">Same evaluator records rule and threshold</text><text x="714" y="830" font-size="23" font-weight="400" fill="#24332c">Manual scan / +1, +7, +30 workspace days</text><text x="714" y="864" font-size="23" font-weight="400" fill="#24332c">Channel records only; no delivery</text><rect x="1325" y="710" width="530" height="205" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="1349" y="752" font-size="26" font-weight="650" fill="#146347">Separate API foundation</text><text x="1349" y="796" font-size="23" font-weight="400" fill="#24332c">FastAPI / MongoDB exist separately</text><text x="1349" y="830" font-size="23" font-weight="400" fill="#24332c">Auth · scoped reads · audit/outbox helpers</text><text x="1349" y="864" font-size="23" font-weight="400" fill="#24332c">Not connected to these workflow actions</text><polyline points="525,405 470,405 470,670 320,670 320,710" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="80" y="650" font-size="21" font-weight="400" fill="#56645c">Scoped snapshot</text><polyline points="1280,475 1280,670 950,670 950,710" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="990" y="696" font-size="21" font-weight="400" fill="#56645c">Alert records</text><text x="72" y="988" font-size="23" font-weight="400" fill="#56645c">Solid: implemented local behavior  ·  Dashed: separate or incomplete operational connection</text><text x="72" y="1032" font-size="24" font-weight="400" fill="#146347">Human actions remain explicit. No statutory approval, secure evidence storage or AICTE integration is implied.</text></g></svg>