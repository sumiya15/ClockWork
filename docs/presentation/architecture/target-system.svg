<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>ClockWork | Target system architecture</title><desc>Solid borders identify existing backend foundations; dashed components or links require operational implementation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b50"/></marker></defs><rect width="1920" height="1080" fill="#f7f8f5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="88" font-size="50" font-weight="700" fill="#163f2d">ClockWork | Target system architecture</text><text x="72" y="135" font-size="25" font-weight="400" fill="#56645c">Solid borders identify existing backend foundations; dashed components or links require operational implementation</text><rect x="60" y="230" width="270" height="370" rx="18" fill="#e8f3ec" stroke="#5b8770" stroke-width="2" /><text x="84" y="272" font-size="26" font-weight="650" fill="#146347">Users</text><text x="84" y="316" font-size="23" font-weight="400" fill="#24332c">Institution</text><text x="84" y="350" font-size="23" font-weight="400" fill="#24332c">Regional officer</text><text x="84" y="384" font-size="23" font-weight="400" fill="#24332c">Bureau officer</text><text x="84" y="418" font-size="23" font-weight="400" fill="#24332c">Committee</text><text x="84" y="452" font-size="23" font-weight="400" fill="#24332c">Admin</text><rect x="395" y="285" width="275" height="240" rx="18" fill="#e8f3ec" stroke="#5b8770" stroke-width="2" /><text x="419" y="327" font-size="26" font-weight="650" fill="#146347">React interface</text><text x="419" y="371" font-size="23" font-weight="400" fill="#24332c">Mobile workflows</text><text x="419" y="405" font-size="23" font-weight="400" fill="#24332c">Scoped dashboards</text><text x="419" y="439" font-size="23" font-weight="400" fill="#24332c">Evidence &amp; reports</text><text x="419" y="473" font-size="23" font-weight="400" fill="#24332c">Human review actions</text><rect x="740" y="195" width="430" height="480" rx="20" fill="#eef4ef" stroke="#9eb7a6" stroke-width="2"/><text x="766" y="235" font-size="31" font-weight="700" fill="#146347">FastAPI</text><rect x="765" y="258" width="380" height="145" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" /><text x="789" y="300" font-size="26" font-weight="650" fill="#146347">Auth &amp; scoped reads</text><text x="789" y="344" font-size="23" font-weight="400" fill="#24332c">Cookie sessions · CSRF · scope</text><text x="789" y="378" font-size="23" font-weight="400" fill="#24332c">Institution / obligation / rules</text><rect x="765" y="430" width="380" height="218" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="789" y="472" font-size="26" font-weight="650" fill="#146347">Operational services</text><text x="789" y="516" font-size="23" font-weight="400" fill="#24332c">Applications · EVC</text><text x="789" y="550" font-size="23" font-weight="400" fill="#24332c">Undertakings · Documents</text><text x="789" y="584" font-size="23" font-weight="400" fill="#24332c">Reports · decisions / closure</text><text x="789" y="618" font-size="23" font-weight="400" fill="#24332c">Human verification gates</text><rect x="1240" y="195" width="620" height="235" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="1264" y="237" font-size="26" font-weight="650" fill="#146347">Shared engine</text><text x="1264" y="281" font-size="23" font-weight="400" fill="#24332c">Published rules · state transitions</text><text x="1264" y="315" font-size="23" font-weight="400" fill="#24332c">SLA pause/resume · deadline evaluation</text><text x="1264" y="349" font-size="23" font-weight="400" fill="#24332c">Escalation and versioned obligations</text><text x="1264" y="383" font-size="23" font-weight="400" fill="#24332c">Partial foundation: rule/date helpers exist</text><rect x="1240" y="510" width="290" height="205" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="1264" y="552" font-size="26" font-weight="650" fill="#146347">Worker</text><text x="1264" y="596" font-size="23" font-weight="400" fill="#24332c">Scheduled scans</text><text x="1264" y="630" font-size="23" font-weight="400" fill="#24332c">Outbox consumption</text><text x="1264" y="664" font-size="23" font-weight="400" fill="#24332c">Delivery / retries</text><rect x="1590" y="510" width="270" height="205" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="1614" y="552" font-size="26" font-weight="650" fill="#146347">Adapters</text><text x="1614" y="596" font-size="23" font-weight="400" fill="#24332c">Authorised AICTE</text><text x="1614" y="630" font-size="23" font-weight="400" fill="#24332c">systems</text><text x="1614" y="664" font-size="23" font-weight="400" fill="#24332c">Notification providers</text><rect x="60" y="800" width="610" height="170" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="84" y="842" font-size="26" font-weight="650" fill="#146347">Future AI endpoint</text><text x="84" y="886" font-size="23" font-weight="400" fill="#24332c">Scoped retrieval through backend</text><text x="84" y="920" font-size="23" font-weight="400" fill="#24332c">Human review; no autonomous decisions</text><rect x="740" y="800" width="520" height="170" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" /><text x="764" y="842" font-size="26" font-weight="650" fill="#146347">MongoDB &amp; audit foundation</text><text x="764" y="886" font-size="23" font-weight="400" fill="#24332c">Collections · sessions · audit / outbox</text><text x="764" y="920" font-size="23" font-weight="400" fill="#24332c">Complete domain persistence still required</text><rect x="1350" y="800" width="510" height="170" rx="18" fill="#ffffff" stroke="#5b8770" stroke-width="2" stroke-dasharray="10 7"/><text x="1374" y="842" font-size="26" font-weight="650" fill="#146347">Protected document storage</text><text x="1374" y="886" font-size="23" font-weight="400" fill="#24332c">Authorised upload / download</text><text x="1374" y="920" font-size="23" font-weight="400" fill="#24332c">Evidence bytes, retention and access logs</text><polyline points="330,405 395,405" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" /><text x="345" y="385" font-size="21" font-weight="400" fill="#56645c">Use</text><polyline points="670,330 740,330" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="673" y="307" font-size="21" font-weight="400" fill="#56645c">HTTPS</text><polyline points="955,403 955,430" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="960" y="421" font-size="21" font-weight="400" fill="#56645c"></text><polyline points="1170,310 1240,310" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1177" y="290" font-size="21" font-weight="400" fill="#56645c">Rules</text><polyline points="1385,510 1385,430" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1400" y="480" font-size="21" font-weight="400" fill="#56645c">Run scan</text><polyline points="1530,610 1590,610" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1532" y="590" font-size="21" font-weight="400" fill="#56645c">Send</text><polyline points="1720,510 1720,465 1170,465" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1630" y="493" font-size="21" font-weight="400" fill="#56645c">Data exchange</text><polyline points="1000,675 1000,800" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="780" y="778" font-size="21" font-weight="400" fill="#56645c">Read / write + audit</text><polyline points="1385,715 1385,755 1175,755 1175,800" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1180" y="735" font-size="21" font-weight="400" fill="#56645c">Outbox / results</text><polyline points="1145,580 1200,580 1200,780 1585,780 1585,800" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1450" y="762" font-size="21" font-weight="400" fill="#56645c">Verified evidence reference</text><polyline points="800,675 800,735 365,735 365,800" fill="none" stroke="#356b50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="390" y="718" font-size="21" font-weight="400" fill="#56645c">Scoped request via FastAPI</text><text x="70" y="1025" font-size="23" font-weight="400" fill="#56645c">Solid: existing component/foundation  ·  Dashed: proposed or incomplete  ·  Arrows: requests, records or jobs</text></g></svg>